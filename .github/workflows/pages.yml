name: Deploy Rock Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run verify:kit
      - run: npm run verify:workshop
      - run: npm run verify:wood
      - run: npm run verify:terrain
      - run: npm run verify:paths
      - run: npm run verify:scene
      - run: npm run verify:scene-presets
      - run: npm run verify:studio-presets
      - run: npm run verify:scene-history
      - run: npm run verify:surface-snap
      - run: npm run verify:camera
      - run: npm run verify:fracture
      - run: npm run verify:fracture-settling
      - run: npm run verify:global-settling
      - run: npm run verify:fracture-wake
      - run: npm run build
      - run: npm run verify:publication
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5.0.1
